<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chasing Fun — Weekend Magazine</title>
  <meta name="description" content="חמישה גלים של מחשבה, גלישה, חיים והשראה — מגזין סופ״ש שבועי של Chasing Fun" />
  <meta property="og:title" content="Chasing Fun — Weekend Magazine" />
  <meta property="og:description" content="חמישה גלים של מחשבה, גלישה, חיים והשראה" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/assets/images/favicon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Heebo", Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      direction: rtl;
      text-align: right;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 24px 18px 80px; }
    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #134e4a 100%);
      color: #fff;
      padding: 48px 24px;
      border-radius: 18px;
      margin-bottom: 24px;
      text-align: center;
    }
    .hero .brand-tag {
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.7;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .hero h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .hero p { font-size: 16px; opacity: 0.85; }
    h2 {
      font-size: 22px;
      margin: 32px 0 16px;
      font-weight: 700;
    }
    .post-card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.1);
    }
    .post-meta {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .post-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .post-excerpt {
      font-size: 14px;
      color: #475569;
    }
    .empty-state {
      background: #fff;
      border-radius: 18px;
      padding: 40px 24px;
      text-align: center;
      color: #64748b;
    }
    footer {
      margin-top: 48px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }
    footer img { max-width: 140px; opacity: 0.8; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="wrap">

    <header class="hero">
      <div class="brand-tag">CHASING FUN WEEKEND MAGAZINE</div>
      <h1>תובנות לסופ״ש</h1>
      <p>חמישה גלים של מחשבה, גלישה, חיים והשראה</p>
    </header>

    <h2>הפוסטים האחרונים</h2>

    <!-- POSTS_LIST_START -->
    <!-- The agent will keep this section updated automatically. Newest post on top. -->
    <div class="empty-state">
      עוד אין פוסטים. הפוסט הראשון יעלה ביום שישי הקרוב.
    </div>
    <!-- POSTS_LIST_END -->

    <footer>
      <img src="https://chasingfun.co.il/wp-content/uploads/2026/03/Final-Logo-01-3.png" alt="Chasing Fun" />
      <div>© Chasing Fun · chasingfun.co.il</div>
    </footer>

  </div>
</body>
</html>
